[package]
name = "morlana"
version = "0.1.0"
edition = "2024"

description = "nix-darwin utilities"
license = "GPL-3.0-or-later"
repository = "https://github.com/ryanccn/morlana.git"

categories = ["command-line-utilities", "development-tools"]
keywords = ["nix", "darwin", "macos", "system"]

[dependencies]
clap = { version = "4.6.10", features = ["derive", "env", "string"] }
clap_complete = "4.6.12"
color-eyre = "0.6.5"
dix = "3.0.0"
enum_dispatch = "0.3.13"
eyre = "0.6.14"
nix = { version = "0.32.0", features = ["process", "user"] }
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uzers = "0.12.2"
walkdir = "2.5.1"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

redundant_closure_for_method_calls = "allow"
module_name_repetitions = "allow"

[lints.rust]
unsafe_code = "forbid"
